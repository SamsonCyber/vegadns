[package]
name = "vegadns"
version = "0.1.0"
edition = "2021"
description = "High-concurrency subdomain enum + HTTP path discovery"
license = "MIT"
readme = "README.md"

[[bin]]
name = "vegadns"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
tokio = { version = "1.40", features = ["rt-multi-thread", "macros", "net", "time", "sync", "io-util", "fs"] }
ahash = "0.8"
rand = "0.8"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"
thiserror = "1.0"
parking_lot = "0.12"
bytes = "1.7"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }

[dev-dependencies]
tempfile = "3.12"
